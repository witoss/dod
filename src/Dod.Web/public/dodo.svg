<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <circle cx="48" cy="48" r="46" fill="#edf3e8"/>

  <!-- A plump dodo in profile, taking one small, cheerful step. -->
  <g stroke="#244f40" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <g fill="none" stroke="#bd793c" stroke-width="3">
      <path d="M38 76v9m-5 1 5-1 6 1"/>
      <path d="M57 76l3 6 7-2"/>
    </g>

    <!-- Soft tail feathers and a slightly unruly crest. -->
    <path d="M27 50C22 49 17 43 13 44C13 50 18 55 25 57Z" fill="#79a28c"/>
    <path d="M26 54C21 55 17 51 14 52C16 58 21 61 27 59Z" fill="#568774"/>
    <path d="M50 21C46 18 46 14 49 12M54 20C54 15 58 13 61 15" fill="none"/>

    <!-- One flowing contour joins the head, short neck, and rounded body. -->
    <path d="M46 44
      C47 40 46 37 46 33
      C44 24 50 19 57 19
      C65 19 70 24 70 31
      C70 37 66 41 63 43
      C62 47 66 50 70 55
      C79 68 67 79 48 79
      C30 79 20 72 20 61
      C20 50 31 42 46 44Z" fill="#568774"/>

    <g stroke="none">
      <path d="M47 33C45 25 51 20 57 20C64 20 69 25 69 31
        C69 37 64 40 62 43C60 47 57 48 53 46C49 43 47 38 47 33Z"
        fill="#79a28c"/>
      <path d="M61 47C62 52 68 56 70 63C73 72 62 77 50 76
        C46 75 43 71 44 64C45 57 52 50 61 47Z" fill="#dce7ce"/>
    </g>

    <!-- A compact wing follows the flank; no extra decorative lines. -->
    <path d="M43 51C37 48 30 51 28 56C27 61 31 66 36 67
      C42 65 48 61 47 56C46.5 54 45 52 43 51Z"
      fill="#497962" stroke-width="1.8"/>

    <!-- The eye and cheek carry the friendly expression without an eyebrow. -->
    <g stroke="none">
      <ellipse cx="61" cy="29.5" rx="4.8" ry="5.8" fill="#fffdf2"/>
      <circle cx="62.4" cy="29.5" r="2.5" fill="#193a34"/>
      <circle cx="63.1" cy="28.6" r=".85" fill="#fffdf2"/>
      <ellipse cx="55.5" cy="36.5" rx="3.4" ry="2.2" fill="#dfa78d"/>
    </g>

    <!-- A rounded bill with a modest hook, rather than a drawn-on smile. -->
    <path d="M68 29.5C75 27 83 29 86 33.5C88 37 86 41 82.5 43
      C82.5 40 81 38.5 78.5 39C74 40 70 39 67 36L65.5 33Z"
      fill="#e9b86b"/>
    <ellipse cx="73" cy="32" rx="1" ry=".7" fill="#8b633e" stroke="none"/>
  </g>
</svg>
