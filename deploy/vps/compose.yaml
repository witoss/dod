name: dod-production
services:
  app:
    image: ${APP_IMAGE:?Deploy a commit-tagged image with deploy.sh}
    environment:
      Tracker__Password: ${TRACKER_PASSWORD:?Set TRACKER_PASSWORD in .env}
      Email__Enabled: ${EMAIL_ENABLED:-false}
      Email__PublicUrl: ${EMAIL_PUBLIC_URL:-}
      Email__Host: ${EMAIL_SMTP_HOST:-}
      Email__Port: ${EMAIL_SMTP_PORT:-587}
      Email__Security: ${EMAIL_SMTP_SECURITY:-StartTls}
      Email__From: ${EMAIL_FROM:-}
      Email__Username: ${EMAIL_SMTP_USERNAME:-}
      Email__Password: ${EMAIL_SMTP_PASSWORD:-}
      ReverseProxy__KnownProxies__0: "172.30.47.3"
    networks:
      - proxy-link
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - tracker-data:/data
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  proxy:
    image: caddy:2-alpine
    networks:
      proxy-link:
        ipv4_address: 172.30.47.3
    environment:
      DOMAIN: ${DOMAIN:?Set your domain in .env}
      ACME_EMAIL: ${ACME_EMAIL:?Set your certificate contact email in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
networks:
  proxy-link:
    ipam:
      config:
        - subnet: 172.30.47.0/29
volumes:
  tracker-data:
    name: dod-production-data
  caddy-data:
  caddy-config:
